services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cinepass
      POSTGRES_USER: cinepass
      POSTGRES_PASSWORD: cinepass
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  web:
    build: .
    volumes: [".:/app"]
    ports: ["8000:8000"]
    depends_on: [db, redis]